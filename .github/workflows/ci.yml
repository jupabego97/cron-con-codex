name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test tools
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
